# ``meshes`` is currently the only top-level key read by this file, keyed
# by mesh name. This leaves other top-level keys, such as ``experiments``
# below, free to be added once they're supported.
meshes:
  oQU240:
    inputs:
      - file: ocean.QU.240km.151209.teos10.260720.nc
        streams: [HorzMeshIn, InitialVertCoord, InitialState]

  EC30to60E2r2:
    inputs:
      - file: ocean.EC30to60E2r2.200908.teos10.260720.nc
        streams: [HorzMeshIn, InitialVertCoord, InitialState]

# A mesh may list multiple ``inputs`` entries when its streams are split
# across separate files:
#
# example_mesh:
#   inputs:
#     - file: example_mesh.horiz_mesh_and_vert_coord.nc
#       streams: [HorzMeshIn, InitialVertCoord]
#     - file: example_mesh.initial_condition.nc
#       streams: [InitialState]

